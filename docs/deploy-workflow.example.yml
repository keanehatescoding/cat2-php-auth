name: CI and Deploy (example)

# Example workflow: lint/test on push/PR, and optionally deploy from main.
# Copy to .github/workflows/ with credentials that have `workflow` scope.
# For deployment, configure repository secrets and review security carefully:
#   - DEPLOY_HOST (e.g. user@host)
#   - DEPLOY_PATH (e.g. /var/www/html/cat2)
#   - DEPLOY_SSH_KEY (private key with least-privilege access)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint and smoke test
        run: |
          set -euo pipefail
          files=$(git ls-files '*.php')
          for f in $files; do php -l "$f"; done
          php tests/smoke.php

