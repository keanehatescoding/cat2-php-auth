services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      CAT2_DB_HOST: db
      CAT2_DB_NAME: CAT2
      CAT2_DB_USER: cat2_user
      CAT2_DB_PASS: ${CAT2_DB_PASS:?set CAT2_DB_PASS in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: CAT2
      MARIADB_USER: cat2_user
      MARIADB_PASSWORD: ${CAT2_DB_PASS:?set CAT2_DB_PASS in .env}
    volumes:
      - dbdata:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  dbdata:
