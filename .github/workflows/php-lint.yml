name: PHP Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP files
        run: |
          set -euo pipefail
          files=$(git ls-files '*.php')
          for f in $files; do
            php -l "$f"
          done

      - name: Run smoke tests
        run: php tests/smoke.php
